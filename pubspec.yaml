name: lonelyreminder
description: "An intelligent OCR-based event reminder app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Packages for our app
  chrono_dart: ^2.0.2

  # Alarm system - proper implementation
  alarm: ^5.1.5
  
  # Notification packages - fallback system
  flutter_local_notifications: ^17.2.2

  # Background task management
  workmanager: ^0.9.0+3

  # Utility Packages
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  intl: ^0.18.1 # For date formatting
  http: ^1.2.1

  # UI
  cupertino_icons: ^1.0.6

  # Timezone support
  timezone: ^0.9.2

  # Firebase and Google Services
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  googleapis: ^12.0.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  get_storage: ^2.1.1
  google_ml_kit: ^0.20.0
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.8

  # Code quality
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/alarm.mp3
    - assets/charizard.jpg
